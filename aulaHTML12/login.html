<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="card">
        <h1>Entrar</h1>
        <p class="subtitulo">Use seu email e sua senha para acessar o site.</p>


        <form id="formLogin" action="#" method="post" novalidate>

            <input type="hidden" name="origem" value="tela-login">

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="email">
                <span class="erro" id="erroEmail" role="alert"></span>
            </div>

            <div class="campo">
                <label for="senha">Senha:</label>
                <div class="senha-wrap">
                    <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres"
                        autocomplete="current-password">
                    <button type="button" id="verSenha" class="ver">Mostrar</button>
                </div>
                <span class="erro" id="erroSenha" role="alert"></span>
            </div>

            <p class="esqueci"><a href="#">Esqueci minha senha</a></p>

            <button type="submit" class="entrar">Entrar</button>

            <p class="sucesso" id="mensagemSucesso" role="status"></p>
        </form>

        <p class="cadastro">Ainda não tem conta? <a href="#">Cadastre-se</a></p>
    </main>

    <script src="login.js"></script>
</body>

</html>
